<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comfort Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a working bench. Left = the rooms you edit live; right = what the client watches
   (verdict, house map, coldest-night chart, checks, what-if, price). Presenting mode enlarges type
   and hides the engineering panels. Hot = vermilion, cold = blue, status = green / amber / red. */
:root{
  --bg:#0A1122; --surface:#131D33; --surface2:#1A2640; --ink:#E8EEFA; --ink2:#9FB0CC; --line:#2A3A5C;
  --accent:#5B84E8; --accent-ink:#FFFFFF; --accent-soft:#1D2D55;
  --heat:#FF8A5B; --heat-soft:#3A2218; --cool:#6DB3F2; --cool-soft:#162B3E;
  --good:#4CC38A; --good-soft:#123227; --warn:#E8B04A; --warn-soft:#3A2E12; --bad:#FF7B72; --bad-soft:#3D1B19;
  --info:#6DB3F2; --info-soft:#162B3E;
  --c-win:#FF8A3D; --c-wall:#F2C14E; --c-air:#6EC6F5; --c-ceil:#3DD6A0; --c-floor:#A98BE0; --c-door:#9AA8B5; --c-sky:#E58BBF;
  --s1:#5AB0F0; --s2:#FF8A5B; --s3:#3DD6A0; --s4:#E58BBF; --s5:#F2C14E;
  --fs:16px; --radius:16px; color-scheme:dark;
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg) radial-gradient(90% 60% at 50% -10%,#16264d 0%,transparent 70%) no-repeat;color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
body.present{--fs:19px}
h1,h2,h3,h4,p{margin:0}
h2{font-size:1.3rem;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:1rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em}
.muted{color:var(--ink2)}
.small{font-size:.86rem}
.tiny{font-size:.78rem}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
body.present .tech{display:none!important}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto;min-width:0}
.brand b{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:.76rem;color:var(--ink2)}
.jobname{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px;min-height:44px;width:min(280px,100%);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.88rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.danger{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;min-height:42px;padding:6px 14px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.sm button{min-height:34px;padding:4px 10px;font-size:.86rem}

/* grid */
.grid{display:grid;grid-template-columns:minmax(340px,440px) minmax(0,1fr);gap:20px;padding-top:18px;align-items:start}
@media (max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.card>header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.card>header p{color:var(--ink2);font-size:.9rem;max-width:62ch}

/* form controls */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;font-weight:700;color:var(--ink2)}
input[type=text],input[type=number],select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);min-width:0}
textarea{min-height:120px;font-family:var(--mono);font-size:.82rem}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.row.r2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;min-width:40px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip:hover{border-color:var(--accent)}
details{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
summary{cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center}
.hint{font-size:.84rem;color:var(--ink2)}

/* rooms */
.room{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.room.flash{animation:flash 1.4s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.room-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,130px) 44px;gap:8px;align-items:end}
.xbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:1.2rem;color:var(--ink2)}
.xbtn:hover{color:var(--bad);border-color:var(--bad)}
.readout{background:var(--surface2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.readout .nums{display:flex;flex-wrap:wrap;gap:4px 16px;font-weight:700}
.sb{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);gap:1px}
.sb i{display:block;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend s{display:inline-block;width:10px;height:10px;border-radius:3px;text-decoration:none}
.glassitems{display:flex;flex-direction:column;gap:6px}
.glassitem{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,.8fr) 40px;gap:6px;align-items:center}
.add-types{display:flex;flex-wrap:wrap;gap:6px}

/* verdict */
.verdict{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.v{border-radius:var(--radius);padding:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--surface);min-width:0}
.v .big{font-size:2.4rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.v.good{background:var(--good-soft);border-color:var(--good)} .v.good .big{color:var(--good)}
.v.warn{background:var(--warn-soft);border-color:var(--warn)} .v.warn .big{color:var(--warn)}
.v.bad{background:var(--bad-soft);border-color:var(--bad)} .v.bad .big{color:var(--bad)}
.v.info{background:var(--info-soft);border-color:var(--info)} .v.info .big{color:var(--info)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good);background:var(--good-soft)} .pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.bad{color:var(--bad);background:var(--bad-soft)} .pill.info{color:var(--info);background:var(--info-soft)}

/* map */
.map{position:relative;width:100%;aspect-ratio:16/10;background:var(--surface2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (max-width:640px){.map{aspect-ratio:4/5}}
.tile{position:absolute;padding:3px;container-type:inline-size}
.tile>button{width:100%;height:100%;text-align:left;border:2px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;overflow:hidden;background:var(--surface);color:var(--ink);line-height:1.25}
.tile b{font-size:1rem;font-weight:800}
.tile .l2{font-size:.84rem}
.tile .l3{font-size:.76rem;font-weight:700}
@container (max-width:130px){.tile .l2,.tile .l3{display:none}.tile b{font-size:.86rem}}
@container (max-width:80px){.tile b{font-size:.72rem}}
.tile.good>button{background:var(--good-soft);border-color:var(--good)}
.tile.warn>button{background:var(--warn-soft);border-color:var(--warn)}
.tile.bad>button{background:var(--bad-soft);border-color:var(--bad)}
.tile.none>button{background:var(--surface2);border-style:dashed}
.maptools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}

/* systems */
.sys{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sys-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.sysdot{width:14px;height:14px;border-radius:4px;flex:none}
.sys-head input[type=text]{width:auto;flex:1 1 140px;font-weight:800;min-height:40px}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .track{position:relative;height:18px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:9px}
.meter .fill.good{background:var(--good)} .meter .fill.warn{background:var(--warn)} .meter .fill.bad{background:var(--bad)}
.meter .mark{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink)}
.meter .cap{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.86rem}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:middle}
th{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
td select,td input[type=number],td input[type=text]{min-height:38px;padding:4px 8px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink2);font-family:var(--font)}
.chart .ch-load{stroke:var(--heat);fill:none;stroke-width:3}
.chart .ch-cap{stroke:var(--cool);fill:none;stroke-width:3}
.chart .ch-grid{stroke:var(--line);stroke-width:1}
.chart .ch-des{stroke:var(--ink2);stroke-dasharray:5 4;stroke-width:1.5}
.chart .ch-def{fill:var(--bad-soft);stroke:none}
.chart .ch-ok{fill:var(--cool-soft);stroke:none;opacity:.7}
.chart .ch-dot{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.chart .lab{fill:var(--ink);font-weight:700}

/* findings */
.finding{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.finding:last-child{border-bottom:0}
.finding h3{font-size:1.02rem}
.finding p{color:var(--ink2);font-size:.94rem;margin-top:2px}
.opts{display:flex;flex-direction:column;gap:4px;margin-top:6px;font-size:.9rem}
.opts div::before{content:"→ ";color:var(--accent);font-weight:800}

/* what-if + quote */
.togs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.tog{border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-height:96px}
.tog[data-on="true"]{border-color:var(--good);background:var(--good-soft)}
.togbtn{border:0;background:transparent;text-align:left;display:flex;flex-direction:column;gap:6px;padding:0;width:100%;min-height:44px}
.tog .t{font-weight:800}
.tog .d{font-size:.9rem;color:var(--ink2)}
.tog .costline{display:flex;align-items:center;gap:6px;font-size:.84rem;margin-top:auto}
.tog .costline input{width:110px;min-height:34px;padding:2px 8px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 130px 40px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.qrow.total{border-bottom:0;font-weight:800;font-size:1.15rem}
.qrow.sub{color:var(--ink2)}
.qrow input[type=text]{min-height:40px}
.qrow input[type=number]{text-align:right;min-height:40px}
.moneybar{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:1px;margin:10px 0 6px;background:var(--line)}
.moneybar i{display:block}
.note{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.88rem;color:var(--ink2)}
.warnbox{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:.9rem}

/* settings */
.overlay{position:fixed;inset:0;background:rgba(8,14,20,.55);z-index:40;display:flex;justify-content:center;align-items:flex-start;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.overlay>.card{width:min(940px,100%);margin-top:8px}
.copied{color:var(--good);font-weight:700;font-size:.9rem}
@media print{.bar,.tools,.xbtn,.addrow,#editor{display:none!important}.grid{display:block}body{background:#fff}}
@media (prefers-reduced-motion:reduce){.room.flash{animation:none}}

/* stage + glass panels + drawer */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,410px);gap:18px;padding-top:18px;align-items:start}
@media (max-width:1000px){.hero{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;border-radius:22px;border:1px solid var(--line);background:radial-gradient(110% 80% at 50% 25%,#1d2d5c 0%,#10193a 55%,#0a1124 100%);padding:16px;overflow:hidden;min-width:0}
.stage-top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start;justify-content:space-between}
.utabs{display:inline-flex;gap:2px;padding:4px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.utabs button{border:0;background:transparent;color:var(--ink2);min-height:40px;padding:6px 16px;border-radius:9px;font-weight:700}
.utabs button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:#fff}
.btuinfo{margin-top:10px}
.btuinfo .k{font-size:.78rem;color:var(--ink2)}
.btuinfo .v2{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
.thumb{text-align:right;font-size:.78rem;color:var(--ink2)}
.thumb svg{display:block;margin-left:auto;margin-top:4px}
.iso{width:100%;height:auto;display:block;margin-top:-6px}
.iso .wall{fill:rgba(255,255,255,.11);stroke:rgba(255,255,255,.5);stroke-width:1}
.iso .wall2{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.28);stroke-width:1}
.iso .glassp{fill:rgba(120,205,255,.38);stroke:rgba(190,230,255,.9);stroke-width:1}
.iso .unit{fill:#fff;filter:url(#glow)}
.iso .floor{stroke:rgba(255,255,255,.4);stroke-width:1}
.iso .rl{fill:#fff;font-weight:800;font-size:14px;paint-order:stroke;stroke:rgba(5,10,25,.75);stroke-width:3.5px;stroke-linejoin:round;text-anchor:middle}
.iso .rs{fill:#e5ecfa;font-weight:700;font-size:12px;paint-order:stroke;stroke:rgba(5,10,25,.75);stroke-width:3px;stroke-linejoin:round;text-anchor:middle}
.iso .tubeg{fill:none;stroke:rgba(255,255,255,.2);stroke-width:10;stroke-linecap:round;filter:url(#glow)}
.iso .tube{fill:none;stroke-width:2.6;stroke-linecap:round;opacity:.95}
.iso .od{fill:#1b2a4d;stroke-width:1.5}
.iso .odt{fill:#2a3d6b}
.iso g[role=button]{cursor:pointer}
.iso g[role=button]:hover .floor{filter:brightness(1.3)}
.stage-bot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;margin-top:6px}
.panels{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(8px);min-width:0}
.bk{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.bk::before{content:"[ "}.bk::after{content:" ]"}
.stat4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.stat4>div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.03)}
.stat4 b{display:block;font-size:1.25rem}.stat4 span{font-size:.78rem;color:var(--ink2)}
.chipline{display:flex;flex-wrap:wrap;gap:8px}
.cl{background:rgba(255,255,255,.07);border-radius:8px;padding:6px 10px;font-size:.84rem;font-weight:700}
.finrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.finout{display:flex;justify-content:space-between;gap:12px;margin:10px 0 4px}
.finout b{font-size:1.4rem;display:block}.finout span{font-size:.78rem;color:var(--ink2)}
input[type=range]{width:100%;accent-color:var(--accent);min-height:30px}
.alt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.alt:last-child{border-bottom:0}
.alt b{font-size:.98rem}.alt .s{font-size:.86rem;color:var(--ink2)}.alt .r{text-align:right;font-weight:800}
.below{padding-top:18px;max-width:1240px;margin-inline:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(470px,100%);z-index:35;overflow:auto;background:var(--bg);border-right:1px solid var(--line);padding:max(14px,env(safe-area-inset-top,0px)) 14px 40px max(14px,env(safe-area-inset-left,0px));transform:translateX(-104%);transition:transform .25s ease;box-shadow:12px 0 40px rgba(0,0,0,.45)}
.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:2}
.scrim{position:fixed;inset:0;background:rgba(3,7,16,.55);z-index:34}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><b>Comfort Planner</b><span>Pre-Manual J load &amp; equipment fit</span></div>
  <input type="text" id="jobName" class="jobname" placeholder="Client / job name" aria-label="Client or job name">
  <div class="tools">
    <div class="seg" role="group" aria-label="View mode">
      <button id="modeCons" aria-pressed="true" data-act="mode" data-v="consult">Consultant</button>
      <button id="modePres" aria-pressed="false" data-act="mode" data-v="present">Presenting</button>
    </div>
    <button class="btn primary" id="btnEdit" data-act="drawer">Edit home</button>
    <button class="btn" id="btnDemo" data-act="demo">Load demo home</button>
    <button class="btn tech" id="btnSettings" data-act="settings">Equipment</button>
    <button class="btn" id="btnCopy" data-act="copy">Copy summary</button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="stage" id="sec-map" aria-label="3D view of the home"></div>
    <aside class="panels" id="sec-panels" aria-label="Summary"></aside>
  </section>
  <section class="below stack" id="viz" aria-label="Details">
    <div id="sec-systems" class="card"></div>
    <div id="sec-checks" class="card"></div>
    <div id="sec-whatif" class="card"></div>
    <div id="sec-quote" class="card"></div>
    <div id="sec-tech" class="card tech"></div>
  </section>
</main>
<div id="scrim" class="scrim" hidden role="button" tabindex="-1" aria-label="Close editor" data-act="closeDrawer"></div>
<aside id="editor" class="drawer stack" aria-label="Edit the home"></aside>

<script>
(function(){
'use strict';
/*ENGINE_START*/
/* ---------- Reference tables (U-values, HTM and solar factors calibrated to a real CoolCalc MJ8 report; items marked "typical" are standard ACCA-style values) ---------- */
const WINDOWS={
  single:{name:'Old single-pane',U:1.13,shgc:.52,Ud:1.67,shgcD:.53},
  double:{name:'Older double-pane',U:.69,shgc:.44,Ud:.75,shgcD:.47},
  lowe:{name:'Newer double-pane Low-E',U:.30,shgc:.28,Ud:.35,shgcD:.28},
  triple:{name:'Triple-pane, high performance',U:.20,shgc:.25,Ud:.25,shgcD:.25}
};
const WALLS={poor:{name:'Poor (little or no insulation)',U:.25},std:{name:'Standard older (R-11)',U:.097},good:{name:'Good (R-19)',U:.062},best:{name:'Excellent (R-25 or better)',U:.045}};
const ATTICS={none:{name:'None (heated space above)',U:0},poor:{name:'Poor (R-11)',U:.08},std:{name:'Standard (R-30)',U:.034},good:{name:'Good (R-38)',U:.027},best:{name:'Excellent (R-49 or better)',U:.02}};
const FLOORS={
  heated:{name:'Over a heated space',kind:'none',U:0},
  crawl_poor:{name:'Over crawl space or basement, no insulation',kind:'crawl',U:.22},
  crawl_std:{name:'Over crawl space or basement, R-11',kind:'crawl',U:.073},
  crawl_good:{name:'Over crawl space or basement, R-19',kind:'crawl',U:.045},
  slab:{name:'Slab on grade',kind:'slab',F:.55},
  slab_ins:{name:'Slab on grade, insulated edge',kind:'slab',F:.30}
};
const LEAK={tight:{name:'Tight (air-sealed / newer)',ach:.20},avg:{name:'Average',ach:.35},loose:{name:'Drafty (older, leaky)',ach:.60}};
const SOLAR={N:5,NE:32,E:50,SE:30,S:21,SW:40,W:36,NW:26}; /* BTU/h/ft2 per unit SHGC, fitted to the MJ8 report with its average shading */
const ORIENTS=['N','NE','E','SE','S','SW','W','NW'];
const ROOM_TYPES={
  bedroom:{label:'Bedroom',occ:1,appS:0,appL:0,sqft:150,ceil:8,cond:true},
  living:{label:'Living room',occ:2,appS:600,appL:0,sqft:300,ceil:8,cond:true},
  kitchen:{label:'Kitchen',occ:1,appS:2365,appL:358,sqft:200,ceil:8,cond:true},
  dining:{label:'Dining area',occ:1,appS:0,appL:0,sqft:200,ceil:8,cond:true},
  office:{label:'Office / den',occ:1,appS:400,appL:0,sqft:120,ceil:8,cond:true},
  bath:{label:'Bathroom',occ:0,appS:0,appL:0,sqft:50,ceil:8,cond:false},
  other:{label:'Other room',occ:0,appS:0,appL:0,sqft:150,ceil:8,cond:true}
};
const GLASS_PRESETS={few:{label:'Few',f:.08},avg:{label:'Average',f:.12},lots:{label:'Lots',f:.18},wall:{label:'Wall of glass',f:.30}};
const WHATIF={
  win:{t:'New Low-E windows and glass doors',d:'Replace old glass with newer double-pane Low-E.'},
  wall:{t:'Add wall insulation',d:'Bring exterior walls up to R-19 (dense-pack / retrofit).'},
  attic:{t:'Attic insulation to R-49',d:'Top up the attic floor insulation.'},
  air:{t:'Air sealing',d:'Seal leaks so the house is tight.'}
};
const T_BAL=60; /* outdoor temp where internal gains cancel the heat loss */

const sum=a=>a.reduce((s,v)=>s+(+v||0),0);
function inh(v,h){return v==='house'?h:v}

function roomLoads(r,ctx){
  const {house,clim,wi}=ctx;
  const dH=clim.winterIn-clim.winterOut, dC=clim.summerOut-clim.summerIn, alt=clim.alt;
  let wk=inh(r.walls,house.walls); if(wi.wall&&WALLS[wk].U>WALLS.good.U) wk='good';
  let ak=inh(r.attic,house.attic); if(wi.attic&&ak!=='none'&&ATTICS[ak].U>ATTICS.best.U) ak='best';
  const fk=inh(r.floor,house.floor);
  let wt=inh(r.winType,house.winType); if(wi.win&&WINDOWS[wt].U>WINDOWS.lowe.U) wt='lowe';
  let lk=house.leak; if(wi.air) lk='tight';
  const W=WINDOWS[wt], sq=+r.sqft||0, ceil=+r.ceil||8, vol=sq*ceil;
  let winH=0,winC=0,doorH=0,doorC=0,skyH=0,skyC=0,glassTot=0;
  for(const g of (r.glass||[])){
    const a=+g.a||0, so=SOLAR[g.o]??20;
    if(g.k==='d'){glassTot+=a;doorH+=a*W.Ud*dH;doorC+=a*.75*(W.Ud*dC+so*W.shgcD)}
    else if(g.k==='s'){skyH+=a*W.U*dH;skyC+=a*(W.U*dC+220*W.shgc)}
    else{glassTot+=a;winH+=a*W.U*dH;winC+=a*(W.U*dC+so*W.shgc)}
  }
  const solid=+r.doorSqft||0;
  const wallNet=(r.wallSqft!=null&&r.wallSqft!=='')?+r.wallSqft:Math.max(0,(+r.ext||0)*Math.sqrt(sq)*ceil-glassTot-solid);
  const wallH=wallNet*WALLS[wk].U*dH, wallC=wallNet*WALLS[wk].U*21;
  const solidH=solid*.6*dH, solidC=solid*.6*23;
  const ceilA=ak==='none'?0:sq, ceilH=ceilA*ATTICS[ak].U*dH, ceilC=ceilA*ATTICS[ak].U*22;
  const F=FLOORS[fk]; let floorH=0,floorC=0;
  if(F.kind==='crawl'){floorH=sq*F.U*.29*dH;floorC=sq*F.U*10}
  else if(F.kind==='slab'){floorH=(+r.ext||0)*Math.sqrt(sq)*F.F*dH}
  const cfm=LEAK[lk].ach*vol/60;
  const airH=1.08*alt*cfm*dH, airS=1.08*alt*(.5*cfm)*dC, airL=.68*alt*(.5*cfm)*clim.grains;
  const occ=+r.occ||0, occS=occ*230, occL=occ*200, appS=+r.appS||0, appL=+r.appL||0;
  const glassC=winC+doorC+skyC, aed=.25*glassC;
  const heat=winH+doorH+skyH+wallH+solidH+ceilH+floorH+airH;
  const coolSens=glassC+wallC+solidC+ceilC+floorC+airS+occS+appS+aed;
  const coolLat=airL+occL+appL;
  return {heat,coolSens,coolLat,cool:coolSens+coolLat,aed,glassTot,wallNet,
    parts:{win:winH+doorH,wall:wallH,air:airH,ceil:ceilH,floor:floorH,door:solidH,sky:skyH}};
}
function retention(T,r5){const s=(1-r5)/42;return Math.min(1,Math.max(.35,1-(47-T)*s))}
function autoHead(need,heads,ret){const hs=[...heads].sort((a,b)=>a-b);return hs.find(h=>h*ret>=need)||hs[hs.length-1]}
function loadAt(T,design,Tdes){return T>=T_BAL?0:design*(T_BAL-T)/(T_BAL-Tdes)}
function balancePoint(design,Tdes,cap){
  if(cap(Tdes)>=design) return null;
  for(let T=Tdes;T<=T_BAL;T+=.25){ if(cap(T)>=loadAt(T,design,Tdes)) return T; }
  return null;
}
function evalModel(m,wi){
  const clim=m.climate, cat=m.catalog, ctx={house:m.house,clim,wi:wi||{}}, Tdes=clim.winterOut;
  const loads={}; m.rooms.forEach(r=>{loads[r.id]=roomLoads(r,ctx)});
  const cond=m.rooms.filter(r=>r.cond!==false);
  const systems=m.systems.map(s=>{
    const out=cat.outdoors.find(o=>o.id===s.out)||cat.outdoors.find(o=>o.type===s.type)||cat.outdoors[0];
    const rooms=cond.filter(r=>r.sys===s.id);
    const heat=sum(rooms.map(r=>loads[r.id].heat)), cool=sum(rooms.map(r=>loads[r.id].cool));
    const r5=out.r5/100, ret=retention(Tdes,r5), single=out.type==='SZ';
    const heads=single?[]:rooms.map(r=>{
      const need=loads[r.id].heat, sug=autoHead(need,cat.heads,ret), btu=r.head||sug, cap=btu*ret;
      return {room:r,need,btu,sug,auto:!r.head,cap,cov:need>0?cap/need:9,cool:loads[r.id].cool};
    });
    const connected=single?out.btu:sum(heads.map(h=>h.btu));
    const capDes=out.btu*ret;
    const cap=T=>out.btu*retention(T,r5);
    return {sys:s,out,rooms,heat,cool,heads,single,connected,connPct:connected/out.btu*100,capDes,ret,
      cov:heat>0?capDes/heat:9,covName:heat>0?out.btu/heat:9,coolRatio:cool>0?out.btu/cool:9,
      bp:balancePoint(heat,Tdes,cap),cap};
  });
  const homeHeat=sum(cond.map(r=>loads[r.id].heat)), homeCool=sum(cond.map(r=>loads[r.id].cool));
  const capT=T=>sum(systems.map(s=>s.cap(T)));
  const capDes=sum(systems.map(s=>s.capDes)), nameplate=sum(systems.map(s=>s.out.btu));
  const parts={win:0,wall:0,air:0,ceil:0,floor:0,door:0,sky:0};
  cond.forEach(r=>{for(const k in parts) parts[k]+=loads[r.id].parts[k]});
  const glassA=sum(cond.map(r=>loads[r.id].glassTot)), wallA=sum(cond.map(r=>loads[r.id].wallNet));
  return {loads,systems,cond,homeHeat,homeCool,capDes,nameplate,capT,bp:balancePoint(homeHeat,Tdes,capT),parts,glassA,wallA,
    unassigned:cond.filter(r=>!systems.some(s=>s.sys.id===r.sys)),
    cov:homeHeat>0?capDes/homeHeat:9, coolRatio:homeCool>0?nameplate/homeCool:9};
}
/* Starting layout: groups rooms into multi-zone / single-zone systems from the catalog */
function autoDesign(m){
  const cat=m.catalog, clim=m.climate, Tdes=clim.winterOut, ev=evalModel(m,m.wi);
  const mz=cat.outdoors.filter(o=>o.type==='MZ').sort((a,b)=>a.btu-b.btu), sz=cat.outdoors.filter(o=>o.type==='SZ').sort((a,b)=>a.btu-b.btu);
  const eff=o=>o.btu*retention(Tdes,o.r5/100);
  const rooms=ev.cond.map(r=>({r,need:ev.loads[r.id].heat})).sort((a,b)=>b.need-a.need);
  const biggest=mz[mz.length-1]; const groups=[];
  for(const it of rooms){
    const g=groups.find(g=>g.items.length<(biggest?biggest.maxHeads:1)&&g.load+it.need<=(biggest?eff(biggest):0));
    if(g){g.items.push(it);g.load+=it.need}else groups.push({items:[it],load:it.need});
  }
  const systems=[]; let nMZ=0,nSZ=0;
  groups.forEach(g=>{
    const single=g.items.length===1&&sz.length;
    const pool=single?sz:mz; if(!pool.length) return;
    let out=pool.find(o=>eff(o)>=g.load&&(o.maxHeads||1)>=g.items.length)||pool[pool.length-1];
    const id='sys'+(systems.length+1)+'_'+Date.now().toString(36);
    systems.push({id,type:out.type,name:out.type==='MZ'?'MZ-'+(++nMZ):'SZ-'+(++nSZ),out:out.id,rooms:g.items.map(i=>i.r.id)});
  });
  return systems;
}
/*ENGINE_END*/

/* ---------- State ---------- */
const KEY='comfortplanner.v1';
let uidN=0; const uid=()=> 'r'+(++uidN)+Math.random().toString(36).slice(2,5);
const sid=()=> 's'+Math.random().toString(36).slice(2,8);
const DEFAULT_CATALOG=()=>({
  outdoors:[
    {id:'VIR12HP230V1R32AO',short:'VIR12',type:'SZ',btu:12000,maxHeads:1,r5:90,maxConn:100,verify:true},
    {id:'MUL30HP230V1R32AO',short:'MUL30',type:'MZ',btu:30000,maxHeads:4,r5:90,maxConn:130,verify:true},
    {id:'MUL42HP230V1R32AO',short:'MUL42',type:'MZ',btu:42000,maxHeads:5,r5:90,maxConn:130,verify:true}
  ],
  heads:[9000,12000,18000,24000]
});
function blankModel(){
  return {v:1,job:'',demo:false,mode:'consult',mapBy:'fit',fin:{years:10,apr:7,downPct:0},
    climate:{label:'Berkshire County, MA',winterOut:1,summerOut:87,winterIn:70,summerIn:75,grains:30,alt:.988},
    house:{walls:'std',attic:'std',floor:'crawl_std',winType:'single',leak:'avg'},
    catalog:DEFAULT_CATALOG(),rooms:[],systems:[],wi:{},wiCost:{},
    quote:{sysPrice:{},addons:[],tbd:[],rebate:''}};
}
function setGlassPreset(r,key){const p=GLASS_PRESETS[key];r.glass=[{k:'w',a:Math.round(r.sqft*p.f),o:r.orient}];r.glassCustom=false;r.glassPreset=key}
function newRoom(type,over){
  const t=ROOM_TYPES[type]||ROOM_TYPES.other;
  const r={id:uid(),name:t.label,type,sqft:t.sqft,ceil:t.ceil,ext:2,orient:'S',walls:'house',attic:'house',floor:'house',winType:'house',
    wallSqft:null,doorSqft:0,glass:[],glassCustom:false,glassPreset:'avg',occ:t.occ,appS:t.appS,appL:t.appL,sys:null,head:null,cond:t.cond,mj:null};
  setGlassPreset(r,'avg'); return Object.assign(r,over||{});
}
function demoModel(){
  const m=blankModel(); m.demo=true; m.job='Demo home (ranch, 6 rooms)';
  const R=(name,type,sqft,ceil,wallSqft,glass,o)=>newRoom(type,Object.assign({name,sqft,ceil,wallSqft,glass,glassCustom:true,glassPreset:null,ext:2,occ:0,appS:0,appL:0},o||{}));
  const b1=R('Bedroom 1','bedroom',201,7.9,234,[{k:'w',a:32,o:'NE'}],{occ:1,orient:'NE',mj:{heat:5847}});
  const b2=R('Bedroom 2','bedroom',122,7.9,162,[{k:'w',a:13,o:'NE'}],{occ:1,orient:'NE',mj:{heat:3175}});
  const b3=R('Bedroom 3','bedroom',195,7.9,253,[{k:'w',a:14,o:'E'},{k:'w',a:16,o:'S'}],{occ:1,orient:'E',mj:{heat:5796}});
  const lv=R('Living Room','living',407,10.5,297,[{k:'w',a:57,o:'N'},{k:'w',a:19,o:'S'}],{occ:1,appS:1024,orient:'N',mj:{heat:10873}});
  const dn=R('Dining Area','dining',310,11,200,[{k:'d',a:35,o:'NW'},{k:'w',a:27,o:'NW'},{k:'d',a:40,o:'N'},{k:'w',a:10,o:'N'},{k:'s',a:8,o:'N'}],{orient:'NW',mj:{heat:15772}});
  const kt=R('Kitchen + Hallway','kitchen',523,8,345,[{k:'d',a:45,o:'NW'},{k:'w',a:15,o:'NW'},{k:'w',a:23,o:'SE'},{k:'w',a:17,o:'W'}],{doorSqft:18,winType:'double',appS:2365,appL:358,orient:'NW',occ:0,mj:{heat:11746}});
  const s1={id:sid(),type:'SZ',name:'SZ Kitchen',out:'VIR12HP230V1R32AO'}, s2={id:sid(),type:'MZ',name:'MZ-1',out:'MUL42HP230V1R32AO'};
  kt.sys=s1.id; [b1,b2,b3].forEach(r=>{r.sys=s2.id;r.head=9000}); [lv,dn].forEach(r=>{r.sys=s2.id;r.head=12000});
  m.rooms=[kt,lv,dn,b1,b2,b3]; m.systems=[s1,s2];
  m.quote={sysPrice:{[s1.id]:6400,[s2.id]:32000},addons:[{n:'3 bathroom electric baseboard heaters',p:3750},{n:'Smart thermostat',p:600},{n:'Old system decommissioning',p:2500}],
    tbd:['Electrical subpanel for the new outdoor units (change order, price per electrician)'],rebate:''};
  return m;
}
let M=null;
function load(){
  try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v===1&&o.rooms) return o}}catch(e){}
  return demoModel();
}

let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(M))}catch(e){}},300)}

/* ---------- Helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US');
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const pc=n=>Math.round(n*100)+'%';
const k1=n=>(Math.round(n/100)/10).toString().replace(/\.0$/,'')+'k';
const opt=(map,sel,extra)=>(extra||'')+Object.entries(map).map(([k,v])=>`<option value="${k}"${k===sel?' selected':''}>${esc(v.name||v.label)}</option>`).join('');
const statusCov=(c,lo)=>c>=1?'good':c>=lo?'warn':'bad';
const sLabel={good:'Covered',warn:'Close',bad:'Short',info:'Large'};
const sysIndex=id=>Math.max(0,M.systems.findIndex(s=>s.id===id));
const sysColor=id=>`var(--s${(sysIndex(id)%5)+1})`;
const getRoom=id=>M.rooms.find(r=>r.id===id);
const outName=o=>o.short||o.id;
const catOut=s=>M.catalog.outdoors.find(o=>o.id===s.out);
function ctxEval(){
  const cur=evalModel(M,M.wi), base=evalModel(M,{});
  const deltas={};
  for(const k of Object.keys(WHATIF)) deltas[k]=evalModel(M,{[k]:true}).homeHeat-base.homeHeat;
  return {cur,base,deltas};
}
let EV=null;

   <div class="field"><span>Glass (windows &amp; doors): ${fmt(glassTot)} ft²</span>

   <div class="field"><span>Sun side (where most glass faces)</span>
    <div class="chips">${ORIENTS.map(o=>`<button class="chip" data-act="orient" data-v="${o}" aria-pressed="${r.orient===o}">${o}</button>`).join('')}</div></div>

    ${mz?`<label class="field"><span>Indoor unit size</span><select id="${id}-head" data-rf="head"><option value="">Auto-pick</option>${M.catalog.heads.map(h=>`<option value="${h}"${+r.head===h?' selected':''}>${fmt(h)} BTU</option>`).join('')}</select></label>`:'<div></div>'}
   </div>

    <div class="stack" style="gap:12px;margin-top:8px">

     <div class="row">

function treemap(items,x,y,w,h){
  if(items.length===1) return [Object.assign({},items[0],{x,y,w,h})];
  const total=sum(items.map(i=>i.a)); let acc=0,best=1,bd=Infinity;
  for(let k=1;k<items.length;k++){acc+=items[k-1].a;const d=Math.abs(acc-total/2);if(d<bd){bd=d;best=k}}
  const A=items.slice(0,best),B=items.slice(best),f=sum(A.map(i=>i.a))/total;
  return w>=h?[...treemap(A,x,y,w*f,h),...treemap(B,x+w*f,y,w*(1-f),h)]:[...treemap(A,x,y,w,h*f),...treemap(B,x,y+h*f,w,h*(1-f))];
}

function niceMax(v){const s=[2000,5000,10000,20000,50000];let st=s.find(x=>v/x<=6)||s[s.length-1];return Math.ceil(v/st)*st}
function balanceChart(design,capFn,Tdes,nameplate,bp,label){
  const W=640,H=270,L=62,R=18,T=26,B=48, Tmin=Math.min(-10,Tdes-10), Tmax=65;

  const pts=[];for(let t=Tmin;t<=Tmax;t+=1) pts.push(t);
  const loadP=pts.map(t=>[x(t),y(loadAt(t,design,Tdes))]), capP=pts.map(t=>[x(t),y(capFn(t))]);
  const line=a=>a.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  let def='';
  if(bp!=null){const ts=pts.filter(t=>t<=bp);ts.push(bp);const up=ts.map(t=>[x(t),y(loadAt(t,design,Tdes))]),dn=ts.slice().reverse().map(t=>[x(t),y(capFn(t))]);def=`<path class="ch-def" d="${line(up.concat(dn))} Z"/>`}
  const grid=[];for(let v=0;v<=ymax;v+=st) grid.push(`<line class="ch-grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12">${v?fmt(v/1000)+'k':'0'}</text>`);
  const xt=[];for(let t=Math.ceil(Tmin/10)*10;t<=Tmax;t+=10) xt.push(`<text x="${x(t)}" y="${H-B+18}" text-anchor="middle" font-size="12">${t}°</text>`);
  const desX=x(Tdes);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}: heat needed versus heat delivered by outside temperature">
   ${grid.join('')}${xt.join('')}
   <path class="ch-ok" d="${line(capP)} L${x(Tmax)} ${y(0)} L${x(Tmin)} ${y(0)} Z"/>${def}
   <line class="ch-des" x1="${desX}" x2="${desX}" y1="${T-6}" y2="${H-B}"/>
   <text x="${desX+6}" y="${T+6}" font-size="12">Coldest night ${Tdes}°F</text>
   <path class="ch-load" d="${line(loadP)}"/><path class="ch-cap" d="${line(capP)}"/>
   ${bp!=null?`<circle class="ch-dot" cx="${x(bp)}" cy="${y(loadAt(bp,design,Tdes))}" r="6"/><text class="lab" x="${Math.min(x(bp)+10,W-R-150)}" y="${y(loadAt(bp,design,Tdes))-12}" font-size="13">Needs backup below ${Math.round(bp)}°F</text>`:''}
   <text x="${(L+W-R)/2}" y="${H-8}" text-anchor="middle" font-size="12">Outside temperature (°F)</text>
   <text x="14" y="${(T+H-B)/2}" text-anchor="middle" font-size="12" transform="rotate(-90 14 ${(T+H-B)/2})">BTU per hour</text>
   <g font-size="12"><line class="ch-load" x1="${W-R-250}" x2="${W-R-226}" y1="${T-8}" y2="${T-8}"/><text x="${W-R-220}" y="${T-4}">Home needs</text>
   <line class="ch-cap" x1="${W-R-128}" x2="${W-R-104}" y1="${T-8}" y2="${T-8}"/><text x="${W-R-98}" y="${T-4}">System delivers</text></g></svg>`;
}

   <div class="cap num"><span>Delivers <b>${fmt(deliver)}</b></span><span>Needs <b>${fmt(need)}</b> (black marker)</span></div></div>`;
}

/* ---------- Viz: checks ---------- */
function findings(){
  const e=EV.cur,base=EV.base,c=M.climate,out=[];
  const ctx={house:M.house,clim:c,wi:M.wi};
  if(!M.rooms.length) return [{sev:'info',t:'Start by adding rooms',b:'Add each room with its size and how much glass it has. Loads update as you type.'}];
  e.unassigned.forEach(r=>out.push({sev:'warn',t:`${r.name} has no indoor unit`,b:'Assign it to a system in its room card, or untick "Include in the mini-split design" if another heat source serves it.'}));
  e.systems.forEach(s=>{
    if(!s.rooms.length) return;
    const n=s.sys.name;
    if(s.cov>=1&&s.covName>=1) out.push({sev:'good',t:`${n}: covers the coldest night`,b:`Needs ${fmt(s.heat)} BTU/h; delivers about ${fmt(s.capDes)} at ${c.winterOut}°F (${pc(s.cov)}).`});
    else if(s.cov>=.9){
      out.push({sev:'warn',t:`${n}: close on the coldest night (${pc(s.cov)})`,
        b:`${s.covName>=1?`Nameplate looks fine (${pc(s.covName)} of the load), but heat pumps lose output in the cold: at ${c.winterOut}°F this one delivers about ${fmt(s.capDes)} BTU/h against ${fmt(s.heat)} needed. `:''}${s.bp!=null?`It keeps up alone down to about ${Math.round(s.bp)}°F. Below that, backup heat fills the gap.`:''}`,
        opts:['Confirm the real capacity at '+c.winterOut+'°F on the manufacturer\'s extended performance table.','Keep an existing heat source as backup (gas baseboard, electric strips) for the few coldest nights.','Cut the load (see What-if) so the same equipment clears 100%.']});
    }else out.push({sev:'bad',t:`${n}: short on the coldest night (${pc(s.cov)})`,b:`Needs ${fmt(s.heat)} BTU/h; the outdoor unit delivers about ${fmt(s.capDes)} at ${c.winterOut}°F.${s.bp!=null?` It keeps up alone only down to about ${Math.round(s.bp)}°F.`:''}`,
      opts:[`Step up one outdoor size${(()=>{const nx=M.catalog.outdoors.filter(o=>o.type===s.out.type&&o.btu>s.out.btu).sort((a,b)=>a.btu-b.btu)[0];return nx?' ('+outName(nx)+')':''})()}.`,'Split the biggest rooms onto their own single-zone unit.','Plan backup heat for the coldest nights.']});
    if(s.single){}
    else{
      s.heads.forEach(h=>{
        const need=h.need; if(h.cov>=.95&&h.btu<=2.2*need) return;
        if(h.cov<.95){
          const nx=M.catalog.heads.filter(b=>b>h.btu).sort((a,b)=>a-b)[0], opts=[];
          if(nx){const conn=(s.connected-h.btu+nx)/s.out.btu*100;opts.push(`Use a ${fmt(nx)} BTU unit here (${pc(nx*s.ret/need)} of need). Connected capacity becomes ${Math.round(conn)}% of the outdoor unit${conn>s.out.maxConn?', over the limit, so it also needs a bigger outdoor unit':''}.`)}
          const wt=inh(h.room.winType,M.house.winType);
          if(WINDOWS[wt].U>WINDOWS.lowe.U&&h.room.glass.length){
            const L2=roomLoads(Object.assign({},h.room,{winType:'lowe'}),ctx);
            opts.push(`Upgrade this room's glass to Low-E: need drops from ${fmt(need)} to ${fmt(L2.heat)} BTU/h, so the ${fmt(h.btu)} BTU unit covers ${pc(h.cap/L2.heat)}.`);
          }
          opts.push('Give this room its own single-zone unit.');
          out.push({sev:h.cov<.8?'bad':'warn',t:`${h.room.name}: ${fmt(h.btu)} BTU unit vs ${fmt(need)} BTU/h needed`,b:`On the coldest night this unit covers about ${pc(h.cov)} of the room. When every room calls for heat at once, a unit cannot make up the difference by borrowing.`,opts});
        }else{
          out.push({sev:'info',t:`${h.room.name}: unit is much bigger than the room needs`,b:`${fmt(need)} BTU/h needed, ${fmt(h.btu)} BTU unit${h.btu<=Math.min(...M.catalog.heads)?' (the smallest size in the catalog)':''}. Inverter units slow down to match, but expect long gentle running rather than full power.`});
        }
      });
      if(s.connPct>s.out.maxConn) out.push({sev:'bad',t:`${n}: indoor units add up to ${Math.round(s.connPct)}% of the outdoor unit`,b:`The limit for this model is about ${s.out.maxConn}%. Reduce unit sizes or step up the outdoor unit.`});
      if(s.heads.length>s.out.maxHeads) out.push({sev:'bad',t:`${n}: ${s.heads.length} rooms on an outdoor unit that supports ${s.out.maxHeads}`,b:'Move a room to another system.'});
    }
  });
  const gShare=e.homeHeat?e.parts.win/e.homeHeat:0, aShare=(e.glassA+e.wallA)?e.glassA/(e.glassA+e.wallA):0;
  if(gShare>.3&&e.glassA>0) out.push({sev:'info',t:`Glass is ${pc(aShare)} of the outside surface but ${pc(gShare)} of the heat loss`,b:'Windows and glass doors are the biggest lever on the size and cost of the system. See the What-if section for the effect of upgrading them.'});
  if(e.coolRatio>2.2&&e.homeCool) out.push({sev:'info',t:`Summer: equipment is ${e.coolRatio.toFixed(1)}× the cooling need`,b:'This is normal when winter heat sets the size in a cold climate. Inverter units reduce output in summer. Very large oversizing can still hurt humidity control.'});
  if(M.catalog.outdoors.some(o=>o.verify&&e.systems.some(s=>s.out.id===o.id))) out.push({sev:'info',t:'Cold-weather capacity is assumed, not measured',b:`Output at low temperatures uses a placeholder (${e.systems[0]?e.systems[0].out.r5:90}% of nameplate at 5°F). Replace it in Equipment with the figure from the manufacturer's extended performance table (NEEP's cold-climate list has it for most models).`});
  const order={bad:0,warn:1,info:2,good:3};
  return out.sort((a,b)=>order[a.sev]-order[b.sev]);
}

  ov.innerHTML=`<div class="card" role="dialog" aria-label="Equipment catalog"><header><h2>Equipment catalog</h2><button class="btn" data-act="closeSettings">Done</button></header>
  <p class="hint" style="margin-bottom:12px">The three outdoor units come from your Sunseb/Portrex documents. Units marked "assumed" have placeholder numbers: replace them with the manufacturer's data. Capacity at 5°F is the most important number, because it sets how much heat the unit still makes on the coldest nights.</p>
  <div class="tablewrap"><table><thead><tr><th>Model</th><th>Type</th><th class="r">Nameplate BTU</th><th class="r">Max indoor units</th><th class="r">% of nameplate at 5°F</th><th class="r">Max connected %</th><th></th></tr></thead><tbody>
  ${cat.outdoors.map((o,i)=>`<tr><td><input type="text" id="co-id${i}" data-cat="id" data-i="${i}" value="${esc(o.id)}" style="min-width:170px"></td>
   <td><select id="co-t${i}" data-cat="type" data-i="${i}"><option${o.type==='SZ'?' selected':''}>SZ</option><option${o.type==='MZ'?' selected':''}>MZ</option></select></td>
   <td class="r"><input type="number" id="co-b${i}" data-cat="btu" data-i="${i}" value="${o.btu}" style="width:100px"></td>
   <td class="r"><input type="number" id="co-h${i}" data-cat="maxHeads" data-i="${i}" value="${o.maxHeads}" style="width:70px"></td>
   <td class="r"><input type="number" id="co-r${i}" data-cat="r5" data-i="${i}" value="${o.r5}" style="width:80px">${o.verify?' <span class="pill warn">assumed</span>':''}</td>
   <td class="r"><input type="number" id="co-c${i}" data-cat="maxConn" data-i="${i}" value="${o.maxConn}" style="width:80px"></td>
   <td><button class="xbtn" style="width:40px;height:40px" data-act="delOut" data-v="${i}" aria-label="Remove model">×</button></td></tr>`).join('')}</tbody></table></div>
  <div class="tools" style="margin:10px 0"><button class="btn sm" data-act="addOut">+ Add outdoor model</button><button class="btn sm danger" data-act="resetCat">Reset catalog</button></div>
  <label class="field"><span>Indoor unit sizes (BTU, comma separated). 9k and 12k appear in your documents; 18k and 24k are assumed.</span><input type="text" id="cat-heads" data-cat="heads" value="${cat.heads.join(', ')}"></label>
  <details><summary>Save or load this job</summary><div class="stack" style="gap:10px;margin-top:8px">
   <div class="tools"><button class="btn sm" data-act="copyJson">Copy job as text</button><span id="jsonMsg" class="copied" aria-live="polite"></span></div>
   <textarea id="jsonBox" aria-label="Job data" placeholder="Paste job text here, then press Load"></textarea>
   <div class="tools"><button class="btn sm" data-act="loadJson">Load pasted job</button><button class="btn sm danger" data-act="blank">Start a blank job</button></div></div></details></div>`;
  ov.hidden=false;
}

/* ---------- Summary text ---------- */
function summaryText(){
  const e=EV.cur,c=M.climate,t=quoteTotals(),L=[];
  L.push(`HOME COMFORT SUMMARY${M.job?' - '+M.job:''}`,`${c.label}. Design temperatures: ${c.winterOut}°F winter, ${c.summerOut}°F summer.`,'');
  L.push(`Coldest night: home needs about ${fmt(e.homeHeat)} BTU/h; planned systems deliver about ${fmt(e.capDes)} BTU/h (${pc(e.cov)}).${e.bp!=null?` They keep up alone down to about ${Math.round(e.bp)}°F.`:''}`);
  L.push(`Hottest day: home needs about ${fmt(e.homeCool)} BTU/h of cooling; systems are rated ${fmt(e.nameplate)} BTU/h.`,'');
  e.systems.forEach(s=>{L.push(`${s.sys.name}: ${outName(s.out)} (${fmt(s.out.btu)} BTU) - ${s.single?s.rooms.map(r=>r.name).join(' + ')+' (one shared indoor unit)':s.heads.map(h=>`${h.room.name} ${fmt(h.btu)} BTU (needs ${fmt(h.need)})`).join('; ')}`)});
  const f=findings().filter(x=>x.sev==='bad'||x.sev==='warn');
  if(f.length){L.push('','Items to review:');f.forEach(x=>L.push(`- ${x.t}`))}
  if(t.sub){L.push('','Price:');t.lines.forEach(l=>L.push(`- ${l.n}: ${money(l.p)}`));if(t.reb)L.push(`- Rebates: -${money(t.reb)}`);L.push(`Total: ${money(t.net)}`)}
  if(M.quote.tbd.length){L.push('','Not yet priced:');M.quote.tbd.forEach(x=>L.push('- '+x))}
  L.push('','Preliminary estimate for planning. Final sizing is confirmed by a Manual J load calculation and site inspection.');
  return L.join('\n');
}
async function copyText(txt,btn){
  let ok=false;
  try{await navigator.clipboard.writeText(txt);ok=true}catch(e){
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(_){}ta.remove();
  }
  if(btn){const o=btn.textContent;btn.textContent=ok?'Copied':'Copy failed';setTimeout(()=>{btn.textContent=o},1500)}
  return ok;
}

/* ---------- Refresh / actions ---------- */
function refresh(skip){
  EV=ctxEval();
  renderPanels();renderMap();renderSystems();renderChecks();renderWhatIf();if(skip!=='quote')renderQuote();renderTech();updateReadouts();
  document.body.classList.toggle('present',M.mode==='present');
  $('#modeCons').setAttribute('aria-pressed',M.mode!=='present');$('#modePres').setAttribute('aria-pressed',M.mode==='present');
  save();
}
function fullRender(){EV=ctxEval();$('#jobName').value=M.job||'';renderEditor();refresh()}
function rerenderRoom(id){
  const r=getRoom(id),el=$(`#room-${id}`);if(!r||!el) return;
  const open=$('details',el)?.open;
  const tmp=document.createElement('div');tmp.innerHTML=roomCard(r);const n=tmp.firstElementChild;
  if(open){const d=$('details',n);if(d)d.open=true}
  el.replaceWith(n);
}
function regenGlass(r){if(!r.glassCustom&&r.glassPreset) setGlassPreset(r,r.glassPreset)}
function scaleGlass(r,total){
  const cur=sum(r.glass.filter(g=>g.k!=='s').map(g=>g.a));
  if(!cur){r.glass.push({k:'w',a:total,o:r.orient})}else r.glass.forEach(g=>{if(g.k!=='s') g.a=Math.round(g.a*total/cur*10)/10});
  r.glassPreset=null;r.glassCustom=true;
}
function snapshot(){return JSON.stringify({systems:M.systems,asg:M.rooms.map(r=>[r.id,r.sys,r.head])})}
function addSystem(type,name,outId){
  const o=M.catalog.outdoors.find(x=>x.type===type);if(!o) return null;
  const n=M.systems.filter(s=>s.type===type).length+1;
  const s={id:sid(),type,name:name||(type+'-'+n),out:outId||o.id};M.systems.push(s);return s;
}
const ACTIONS={
  drawer(){$('#editor').classList.add('open');$('#scrim').hidden=false},
  closeDrawer(){$('#editor').classList.remove('open');$('#scrim').hidden=true},
  mode(t){M.mode=t.dataset.v;refresh()},
  demo(){M=demoModel();fullRender()},
  copy(t){copyText(summaryText(),t)},
  settings(){renderSettings()},
  closeSettings(){$('#overlay').hidden=true;fullRender()},
  mapBy(t){M.mapBy=t.dataset.v;refresh()},
  gotoRoom(t){
    ACTIONS.drawer();
    setTimeout(()=>{const el=$(`#room-${t.dataset.v}`);if(!el) return;const d=$('details',el);el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')},260);
  },
  addRoom(t){const r=newRoom(t.dataset.v);r.name=r.name+(M.rooms.filter(x=>x.type===r.type).length?' '+(M.rooms.filter(x=>x.type===r.type).length+1):'');M.rooms.push(r);fullRender();const el=$(`#room-${r.id}`);if(el) el.scrollIntoView({block:'center'})},
  delRoom(t){const id=t.closest('[data-rid]').dataset.rid;M.rooms=M.rooms.filter(r=>r.id!==id);fullRender()},
  ext(t){const r=getRoom(t.closest('[data-rid]').dataset.rid);r.ext=+t.dataset.v;r.wallSqft=null;rerenderRoom(r.id);refresh()},
  glassPreset(t){const r=getRoom(t.closest('[data-rid]').dataset.rid);setGlassPreset(r,t.dataset.v);rerenderRoom(r.id);refresh()},
  orient(t){const r=getRoom(t.closest('[data-rid]').dataset.rid);r.orient=t.dataset.v;if(!r.glassCustom) r.glass.forEach(g=>g.o=r.orient);rerenderRoom(r.id);refresh()},
  addGlass(t){const r=getRoom(t.closest('[data-rid]').dataset.rid);r.glass.push({k:'w',a:15,o:r.orient});r.glassCustom=true;r.glassPreset=null;rerenderRoom(r.id);refresh()},
  delGlass(t){const r=getRoom(t.closest('[data-rid]').dataset.rid);r.glass.splice(+t.dataset.v,1);r.glassCustom=true;r.glassPreset=null;rerenderRoom(r.id);refresh()},
  wi(t){const k=t.dataset.v;M.wi[k]=!M.wi[k];refresh()},
  addSys(t){addSystem(t.dataset.v);fullRender()},
  delSys(t){const id=t.dataset.sid;M.systems=M.systems.filter(s=>s.id!==id);M.rooms.forEach(r=>{if(r.sys===id){r.sys=null;r.head=null}});fullRender()},
  auto(){
    M._undo=snapshot();const plan=autoDesign(M);
    M.systems=plan.map(p=>({id:p.id,type:p.type,name:p.name,out:p.out}));
    M.rooms.forEach(r=>{r.sys=null;r.head=null});
    plan.forEach(p=>p.rooms.forEach(id=>{getRoom(id).sys=p.id}));
    M.quote.sysPrice={};fullRender();
  },
  undo(){
    if(!M._undo) return;const o=JSON.parse(M._undo);M.systems=o.systems;M.rooms.forEach(r=>{r.sys=null;r.head=null});
    o.asg.forEach(([id,s,h])=>{const r=getRoom(id);if(r){r.sys=s;r.head=h}});delete M._undo;fullRender();
  },
  addAddon(){M.quote.addons.push({n:'New item',p:0});renderQuote();save()},
  delAddon(t){M.quote.addons.splice(+t.dataset.v,1);refresh()},
  addTbd(){M.quote.tbd.push('Item to be quoted');M.quote.tbd=M.quote.tbd.map(String);refresh();const li=$$('#sec-quote li');},
  delTbd(t){M.quote.tbd.splice(+t.dataset.v,1);refresh()},
  addOut(){M.catalog.outdoors.push({id:'NEW-MODEL',short:'NEW',type:'MZ',btu:36000,maxHeads:4,r5:90,maxConn:130,verify:true});renderSettings()},
  delOut(t){M.catalog.outdoors.splice(+t.dataset.v,1);renderSettings()},
  resetCat(){M.catalog=DEFAULT_CATALOG();renderSettings()},
  copyJson(t){const o=JSON.parse(JSON.stringify(M));delete o._undo;copyText(JSON.stringify(o),null).then(ok=>{$('#jsonMsg').textContent=ok?'Copied to clipboard':'Copy failed: select the box below and copy by hand'});if(!$('#jsonBox').value)$('#jsonBox').value=JSON.stringify(o)},
  loadJson(){try{const o=JSON.parse($('#jsonBox').value);if(!o||o.v!==1||!o.rooms) throw 0;M=o;$('#overlay').hidden=true;fullRender()}catch(e){$('#jsonMsg').textContent='That text is not a saved job.'}},
  blank(){M=blankModel();$('#overlay').hidden=true;fullRender()}
};
function onInput(e){
  const t=e.target;
  if(t.id==='jobName'){M.job=t.value;save();return}
  if(t.dataset.clim){const k=t.dataset.clim;M.climate[k]=k==='label'?t.value:(parseFloat(t.value)||0);refresh();return}
  if(t.dataset.house){M.house[t.dataset.house]=t.value;refresh();return}
  const card=t.closest('[data-rid]');
  if(card&&t.dataset.rf){
    const r=getRoom(card.dataset.rid),f=t.dataset.rf;let v=t.value;
    if(t.type==='checkbox') v=t.checked;
    else if(t.type==='number') v=v===''?null:parseFloat(v);
    if(f==='mj'){r.mj=v?{heat:v}:null}
    else if(f==='cond'){r.cond=v;rerenderRoom(r.id);refresh();return}
    else if(f==='sys'){r.sys=v||null;r.head=null;rerenderRoom(r.id);refresh();return}
    else if(f==='head'){r.head=v?+v:null}
    else if(f==='wallSqft'){r.wallSqft=v}
    else if(f==='sqft'||f==='ceil'||f==='occ'||f==='appS'||f==='doorSqft'){r[f]=v??0;if(f==='sqft') regenGlass(r)}
    else r[f]=v;
    refresh();
    return;
  }
  if(card&&t.dataset.gi!==undefined){
    const r=getRoom(card.dataset.rid),g=r.glass[+t.dataset.gi],f=t.dataset.gf;
    g[f]=f==='a'?(parseFloat(t.value)||0):t.value;r.glassCustom=true;r.glassPreset=null;refresh();return;
  }
  const a=t.dataset.act;
  if(a==='sysName'){const s=M.systems.find(s=>s.id===t.dataset.sid);s.name=t.value;renderPanels();renderMap();renderChecks();save();return}
  if(a==='sysPrice'){M.quote.sysPrice[t.dataset.sid]=t.value===''?'':parseFloat(t.value);updateQuoteTotals();save();return}
  if(a==='addonName'){M.quote.addons[+t.dataset.v].n=t.value;save();return}
  if(a==='addonPrice'){M.quote.addons[+t.dataset.v].p=t.value===''?'':parseFloat(t.value);updateQuoteTotals();save();return}
  if(a==='finYears'){M.fin.years=+t.value;updateFin();save();return}
  if(a==='finApr'){M.fin.apr=parseFloat(t.value)||0;updateFin();save();return}
  if(a==='finDown'){M.fin.downPct=+t.value;updateFin();save();return}
  if(a==='tbdText'){M.quote.tbd[+t.dataset.v]=t.value;save();return}
  if(a==='rebate'){M.quote.rebate=t.value===''?'':parseFloat(t.value);updateQuoteTotals();save();return}
  if(a==='wiCost'){M.wiCost[t.dataset.v]=t.value===''?'':parseFloat(t.value);updateQuoteTotals();save();return}
}
function onChange(e){
  const t=e.target,a=t.dataset.act;
  if(t.dataset.cat){
    const k=t.dataset.cat;
    if(k==='heads'){const h=t.value.split(/[ ,]+/).map(Number).filter(n=>n>0);if(h.length) M.catalog.heads=[...new Set(h)].sort((x,y)=>x-y);return}
    const o=M.catalog.outdoors[+t.dataset.i];
    o[k]=(k==='id'||k==='type')?t.value:(parseFloat(t.value)||0);
    if(k==='id') o.short=t.value.slice(0,5).toUpperCase();
    if(k==='r5') o.verify=false;
    renderSettings();return;
  }
  if(a==='headSel'){const r=getRoom(t.dataset.rid);r.head=t.value?+t.value:null;rerenderRoom(r.id);refresh();return}
  if(a==='sysOut'){const s=M.systems.find(s=>s.id===t.dataset.sid);s.out=t.value;refresh();return}
}
document.addEventListener('input',onInput);
document.addEventListener('change',onChange);
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act],[role=button][data-act]');if(!b) return;
  const f=ACTIONS[b.dataset.act];if(f) f(b);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#overlay').hidden){$('#overlay').hidden=true;fullRender()}else ACTIONS.closeDrawer()}
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.tagName!=='BUTTON'){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
M=load();if(!M.fin)M.fin={years:10,apr:7,downPct:0};
fullRender();
window.__planner={get model(){return M},evalModel,roomLoads,findings};
})();
</script>
